name: Buffer Cloud Queue Auto-Refill

on:
  schedule:
    # Runs every 3 hours at minute 15 (e.g. 00:15, 03:15, 06:15, 09:15, 12:15, 15:15, 18:15, 21:15 UTC)
    - cron: '15 */3 * * *'
  workflow_dispatch:

jobs:
  refill:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit & Refill Buffer Queue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/refill_buffer.mjs
